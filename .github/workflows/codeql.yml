# .github/workflows/codeql.yml
# GitHub CodeQL static analysis (free for public repos). Finds injection,
# SSRF, path traversal, unsafe redirects, prototype pollution etc. in our own
# TypeScript — complementary to scripts/check-route-auth.mjs, which checks
# EduNexus-specific auth rules CodeQL can't know. Findings appear under the
# repo's Security → Code scanning tab and on PRs.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 3 * * 1' # weekly, Monday 03:30 UTC — new queries ship over time
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
