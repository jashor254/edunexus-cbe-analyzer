<!DOCTYPE html>
<html>
<head>
    <title>Paystack Key Test</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 600px; margin: 0 auto; }
        button { padding: 10px 20px; font-size: 16px; background: green; color: white; border: none; border-radius: 5px; cursor: pointer; }
        pre { background: #f4f4f4; padding: 10px; overflow-x: auto; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>🔑 Paystack Key Test</h1>
    <psk_test_96d4539d4f57289ba2aa1755f3daf492676b49f1p>
    
    <input type="text" id="keyInput" placeholder="sk_test_xxxxxxxxxx" style="width: 100%; padding: 10px; margin-bottom: 10px;">
    <button onclick="testKey()">Test Key</button>
    
    <div id="result" style="margin-top: 20px;"></div>

    <script>
        async function testKey() {
            const key = document.getElementById('keyInput').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!key) {
                resultDiv.innerHTML = '<p class="error">❌ Please enter your key</p>';
                return;
            }
            
            resultDiv.innerHTML = '<p>Testing... ⏳</p>';
            
            try {
                const response = await fetch('https://api.paystack.co/transaction/initialize', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${key}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'test@example.com',
                        amount: 10000,
                        currency: 'KES',
                        channels: ['mpesa']
                    })
                });

                const data = await response.json();
                
                if (response.ok && data.status) {
                    resultDiv.innerHTML = `
                        <p class="success">✅ SUCCESS! Key inafanya kazi!</p>
                        <p>Authorization URL: <a href="${data.data.authorization_url}" target="_blank">${data.data.authorization_url}</a></p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <p class="error">❌ ERROR: ${data.message || 'Unknown error'}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">❌ ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
